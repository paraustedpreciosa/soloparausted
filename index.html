<!DOCTYPE html>
<html lang="es" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloParaUsted - Frases Románticas Diarias</title>
    
    <!-- Meta tags SEO y Redes Sociales -->
    <meta name="description" content="Una frase romántica única cada día, creada para dedicar y compartir con el corazón.">
    <meta name="theme-color" content="#FFF5F7">

    <!-- Tipografías Google Fonts: Cormorant Garamond (Serif poética) + Plus Jakarta Sans (Limpia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. VARIABLES DE TEMA (ROSÉ CREAM & MIDNIGHT ROSE)
           ========================================================================== */
        :root[data-theme="day"] {
            --bg-main: #FFF5F7;
            --bg-card: #FFFFFF;
            --bg-pill: #FAD2E1;
            --bg-pill-hover: #F7BFD3;
            --accent-pink: #D8A4B8;
            --text-primary: #6B3E48;
            --text-secondary: #8C6A72;
            --text-muted: #B08B95;
            --border-soft: rgba(216, 164, 184, 0.3);
            --shadow-soft: 0 12px 35px rgba(107, 62, 72, 0.06);
            --shadow-hover: 0 18px 40px rgba(107, 62, 72, 0.12);
            --delete-btn: #D96868;
            --canvas-bg: #FFF5F7;
            --canvas-card: #FFFFFF;
        }

        :root[data-theme="night"] {
            --bg-main: #1D1016;
            --bg-card: #2D1A21;
            --bg-pill: #4A2E38;
            --bg-pill-hover: #5E3B48;
            --accent-pink: #E8B4C8;
            --text-primary: #FFF5F7;
            --text-secondary: #E0C0CB;
            --text-muted: #9E7B87;
            --border-soft: rgba(232, 180, 200, 0.2);
            --shadow-soft: 0 12px 35px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 18px 40px rgba(0, 0, 0, 0.6);
            --delete-btn: #FF8A8A;
            --canvas-bg: #1D1016;
            --canvas-card: #2D1A21;
        }

        /* ==========================================================================
           2. RESETEO Y ESTILOS BASE
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1rem;
            line-height: 1.6;
            transition: background-color 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           3. ENCABEZADO Y NAVEGACIÓN
           ========================================================================== */
        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
        }

        .brand-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Botón de Conmutador de Tema (Día/Noche) */
        .theme-toggle-btn {
            background: var(--bg-pill);
            border: 1px solid var(--border-soft);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.08) rotate(15deg);
            background: var(--bg-pill-hover);
        }

        .theme-toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        /* ==========================================================================
           4. CONTENEDOR PRINCIPAL Y LOGO
           ========================================================================== */
        .main-container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            justify-content: center;
        }

        .logo-container {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-svg {
            width: 64px;
            height: 64px;
            fill: var(--accent-pink);
            margin-bottom: 0.5rem;
            animation: pulseHeart 3.5s infinite ease-in-out;
            transition: fill 0.5s ease;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-secondary);
            margin-top: 0.4rem;
            font-weight: 500;
        }

        /* ==========================================================================
           5. MÓDULO 1: CATEGORÍAS Y FILTROS DINÁMICOS
           ========================================================================== */
        .categories-nav {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            width: 100%;
        }

        .cat-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            color: var(--text-secondary);
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .cat-chip:hover {
            border-color: var(--accent-pink);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .cat-chip.active {
            background: var(--bg-pill);
            color: var(--text-primary);
            border-color: var(--accent-pink);
            font-weight: 600;
            box-shadow: var(--shadow-soft);
        }

        /* ==========================================================================
           6. TARJETA CENTRAL DE LA FRASE
           ========================================================================== */
        .quote-card {
            background-color: var(--bg-card);
            width: 100%;
            padding: 3.2rem 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
            position: relative;
            margin-bottom: 2rem;
            transition: all 0.5s ease;
        }

        .quote-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .quote-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .quote-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .quote-badge {
            font-size: 0.72rem;
            background: var(--bg-pill);
            color: var(--text-primary);
            padding: 0.2rem 0.75rem;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .quote-text-wrapper {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2.2rem;
        }

        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            line-height: 1.45;
            color: var(--text-primary);
            font-weight: 400;
            font-style: italic;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .quote-actions {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-main);
            color: var(--text-primary);
            border: 1px solid var(--border-soft);
            padding: 0.7rem 1.3rem;
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            outline: none;
        }

        .btn:hover {
            background-color: var(--bg-pill);
            border-color: var(--accent-pink);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ==========================================================================
           7. PANEL DE ADMINISTRACIÓN (#admin)
           ========================================================================== */
        .admin-panel {
            display: none;
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-soft);
            text-align: left;
            margin-top: 1rem;
            animation: fadeIn 0.4s ease-out;
        }

        .admin-panel h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-primary);
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-group textarea, .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group textarea:focus, .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-pink);
        }

        .history-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--border-soft);
            padding-top: 1.5rem;
        }

        .history-section h3 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .history-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.3rem;
        }

        .history-item {
            background: var(--bg-main);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .history-info {
            flex: 1;
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .history-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-style: italic;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--delete-btn);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: rgba(217, 104, 104, 0.12);
        }

        /* ==========================================================================
           8. TOAST DE NOTIFICACIÓN
           ========================================================================== */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-primary);
            color: var(--bg-main);
            padding: 0.75rem 1.6rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ==========================================================================
           9. PIE DE PÁGINA Y ANIMACIONES
           ========================================================================== */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 1.2rem 0.8rem; }
            .logo-title { font-size: 2.3rem; }
            .quote-card { padding: 2.2rem 1.4rem; border-radius: 20px; }
            .quote-text { font-size: 1.55rem; }
            .quote-actions { flex-direction: column; width: 100%; }
            .btn { width: 100%; justify-content: center; }
            .categories-nav { gap: 0.4rem; }
            .cat-chip { padding: 0.45rem 0.85rem; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <a href="#" class="brand-title" onclick="showHome(event)">SoloParaUsted</a>
        <div class="header-actions">
            <!-- MÓDULO 3: Conmutador de Tema Día/Noche -->
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Cambiar tema" onclick="toggleTheme()">
                <svg id="theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="theme-icon-moon" viewBox="0 0 24 24" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
            <nav>
                <a href="#admin" onclick="showAdmin(event)">Administrador</a>
            </nav>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-container">
        
        <!-- VISTA PRINCIPAL DE FRASES -->
        <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            
            <a href="#" class="logo-container" onclick="showHome(event)" aria-label="SoloParaUsted - Inicio">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <h1 class="logo-title">SoloParaUsted</h1>
                <p class="logo-subtitle">Frases Románticas Diarias</p>
            </a>

            <!-- MÓDULO 1: Navegador de Categorías y Filtros Dinámicos -->
            <div class="categories-nav" id="categories-nav">
                <button class="cat-chip active" onclick="filterCategory('Todas')">Todas</button>
                <button class="cat-chip" onclick="filterCategory('Amor')">Amor</button>
                <button class="cat-chip" onclick="filterCategory('Ternura')">Ternura</button>
                <button class="cat-chip" onclick="filterCategory('Distancia')">Distancia</button>
                <button class="cat-chip" onclick="filterCategory('Gratitud')">Gratitud</button>
                <button class="cat-chip" onclick="filterCategory('Pasión')">Pasión</button>
            </div>

            <!-- Tarjeta Central -->
            <article class="quote-card">
                <div class="quote-header">
                    <span class="quote-date" id="current-date">Cargando fecha...</span>
                    <span class="quote-badge" id="quote-category">Amor</span>
                </div>

                <div class="quote-text-wrapper">
                    <blockquote class="quote-text" id="quote-text">
                        "Cargando frase romántica para ti..."
                    </blockquote>
                </div>

                <div class="quote-actions">
                    <button class="btn" onclick="copyQuote()">
                        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copiar Frase
                    </button>
                    
                    <!-- MÓDULO 2: Botón para Generar y Descargar Tarjeta en Canvas -->
                    <button class="btn" onclick="generateAndDownloadImage()">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Descargar Imagen
                    </button>

                    <button class="btn" onclick="shareQuote()">
                        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        Compartir
                    </button>
                </div>
            </article>

        </div>

        <!-- VISTA DE ADMINISTRADOR (#admin) -->
        <section id="admin-view" class="admin-panel">
            <h2>Panel de Creación</h2>
            <div class="form-group">
                <label for="new-quote-text">Nueva Frase Romántica</label>
                <textarea id="new-quote-text" rows="3" placeholder="Escribe tu frase aquí con todo el corazón..."></textarea>
            </div>
            <div class="form-group">
                <label for="new-quote-date">Fecha de Publicación</label>
                <input type="date" id="new-quote-date">
            </div>
            <div class="form-group">
                <label for="new-quote-category">Categoría</label>
                <select id="new-quote-category">
                    <option value="Amor">Amor</option>
                    <option value="Ternura">Ternura</option>
                    <option value="Distancia">Distancia</option>
                    <option value="Gratitud">Gratitud</option>
                    <option value="Pasión">Pasión</option>
                </select>
            </div>
            <button class="btn" onclick="saveNewQuote()" style="background-color: var(--text-primary); color: var(--bg-main); width: 100%; justify-content: center; font-weight: 600;">Guardar Frase</button>
            <p id="admin-feedback" style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 1rem; text-align: center;"></p>

            <!-- Historial de Frases -->
            <div class="history-section">
                <h3>Historial de Frases (<span id="total-count">0</span>)</h3>
                <div class="history-list" id="history-list">
                    <!-- Elementos del historial insertados vía JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        SoloParaUsted © 2026 • Creado para inspirar amor cada día
    </footer>

    <!-- NOTIFICACIÓN TOAST -->
    <div class="toast" id="toast">¡Frase copiada al portapapeles!</div>

    <!-- CANVAS OCULTO PARA EXPORTAR TARJETAS EN IMAGEN -->
    <canvas id="export-canvas" width="1080" height="1080" style="display: none;"></canvas>

    <!-- LÓGICA JAVASCRIPT VANILLA COMPLETA -->
    <script>
        /* ==========================================================================
           DATOS INICIALES Y RESPALDO LOCAL
           ========================================================================== */
        const DEFAULT_QUOTES = [
            { id: 1, fecha: "2026-10-27", texto: "Eres mi primer pensamiento al despertar y el último antes de soñar. Eres mi hoy y todos mis mañanas.", categoria: "Amor" },
            { id: 2, fecha: "2026-10-26", texto: "No importa la distancia que nos separe, siempre estamos bajo el mismo cielo mirando la misma luna.", categoria: "Distancia" },
            { id: 3, fecha: "2026-10-25", texto: "Gracia por enseñarme que el amor no se busca, se construye día a día con pequeños detalles.", categoria: "Gratitud" },
            { id: 4, fecha: "2026-10-24", texto: "En la pausa suave de tu abrazo encontré el único refugio donde todo cobra sentido.", categoria: "Ternura" },
            { id: 5, fecha: "2026-10-23", texto: "Tu mirada tiene el fuego exacto para encender cada rincón de mi alma.", categoria: "Pasión" }
        ];

        let loadedQuotes = [];
        let currentFilter = 'Todas';
        const todayISO = new Date().toISOString().split('T')[0];

        /* ==========================================================================
           INICIONALIZACIÓN
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            displayCurrentDate();
            loadQuotes();

            // Setea fecha del admin por defecto
            document.getElementById('new-quote-date').value = todayISO;
        });

        function displayCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayFormatted = new Date().toLocaleDateString('es-ES', options);
            document.getElementById('current-date').textContent = todayFormatted;
        }

        /* ==========================================================================
           MÓDULO 3: MODO NOCTURNO / DIURNO (ROSE CREAM & MIDNIGHT ROSE)
           ========================================================================== */
        function initTheme() {
            const savedTheme = localStorage.getItem('soloparausted_theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                // Auto-detección por hora o preferencia de sistema
                const hour = new Date().getHours();
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (hour >= 20 || hour < 7 || prefersDark) {
                    setTheme('night');
                } else {
                    setTheme('day');
                }
            }
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');

            if (theme === 'night') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
            localStorage.setItem('soloparausted_theme', theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const nextTheme = currentTheme === 'night' ? 'day' : 'night';
            setTheme(nextTheme);
            showToast(nextTheme === 'night' ? 'Modo Midnight Rose activado' : 'Modo Rosé Cream activado');
        }

        /* ==========================================================================
           GESTIÓN DE DATOS (LOCALSTORAGE + RESPALDO)
           ========================================================================== */
        async function loadQuotes() {
            const localStored = localStorage.getItem('soloparausted_frases');
            if (localStored) {
                try {
                    loadedQuotes = JSON.parse(localStored);
                } catch (e) {
                    loadedQuotes = [...DEFAULT_QUOTES];
                }
            } else {
                try {
                    const response = await fetch('frases.json');
                    if (response.ok) {
                        const data = await response.json();
                        loadedQuotes = data.frases || DEFAULT_QUOTES;
                    } else {
                        loadedQuotes = [...DEFAULT_QUOTES];
                    }
                } catch (err) {
                    loadedQuotes = [...DEFAULT_QUOTES];
                }
                localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));
            }

            renderQuote();
            renderHistory();
        }

        /* ==========================================================================
           MÓDULO 1: FILTRADO DINÁMICO DE CATEGORÍAS
           ========================================================================== */
        function filterCategory(category) {
            currentFilter = category;
            
            // Actualizar chips activos
            const chips = document.querySelectorAll('.cat-chip');
            chips.forEach(chip => {
                if (chip.textContent.trim() === category) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            renderQuote();
        }

        function renderQuote() {
            let filtered = loadedQuotes;
            if (currentFilter !== 'Todas') {
                filtered = loadedQuotes.filter(q => q.categoria === currentFilter);
            }

            const quoteTextEl = document.getElementById('quote-text');
            const quoteCategoryEl = document.getElementById('quote-category');

            if (filtered.length === 0) {
                quoteTextEl.style.opacity = '0';
                setTimeout(() => {
                    quoteTextEl.textContent = `“No hay frases disponibles en la categoría ${currentFilter} aún.”`;
                    quoteCategoryEl.textContent = currentFilter;
                    quoteTextEl.style.opacity = '1';
                }, 200);
                return;
            }

            // Buscar frase del día o la última guardada en la categoría
            let selectedQuote = filtered.find(q => q.fecha === todayISO);
            if (!selectedQuote) {
                selectedQuote = filtered[filtered.length - 1];
            }

            quoteTextEl.style.opacity = '0';
            setTimeout(() => {
                quoteTextEl.textContent = `“${selectedQuote.texto}”`;
                quoteCategoryEl.textContent = selectedQuote.categoria || 'Amor';
                quoteTextEl.style.opacity = '1';
            }, 200);
        }

        /* ==========================================================================
           MÓDULO 2: GENERADOR DE TARJETAS EN CANVAS (EXPORTAR PNG)
           ========================================================================== */
        function generateAndDownloadImage() {
            const quoteText = document.getElementById('quote-text').textContent.replace(/^[“"']|["'”]$/g, '').trim();
            const category = document.getElementById('quote-category').textContent;
            
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            const isNight = document.documentElement.getAttribute('data-theme') === 'night';

            // Colores de tarjeta según el tema actual
            const bgGradientStart = isNight ? '#1D1016' : '#FFF5F7';
            const bgGradientEnd = isNight ? '#2A1620' : '#FCEBF0';
            const cardBg = isNight ? '#2D1A21' : '#FFFFFF';
            const textColor = isNight ? '#FFF5F7' : '#6B3E48';
            const accentColor = isNight ? '#E8B4C8' : '#D8A4B8';
            const subTextColor = isNight ? '#E0C0CB' : '#8C6A72';

            // 1. Fondo del lienzo
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, bgGradientStart);
            grad.addColorStop(1, bgGradientEnd);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Tarjeta Interna Elegante
            const padding = 80;
            const cardX = padding;
            const cardY = padding;
            const cardWidth = width - (padding * 2);
            const cardHeight = height - (padding * 2);
            const radius = 40;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 20;

            ctx.beginPath();
            ctx.moveTo(cardX + radius, cardY);
            ctx.arcTo(cardX + cardWidth, cardY, cardX + cardWidth, cardY + cardHeight, radius);
            ctx.arcTo(cardX + cardWidth, cardY + cardHeight, cardX, cardY + cardHeight, radius);
            ctx.arcTo(cardX, cardY + cardHeight, cardX, cardY, radius);
            ctx.arcTo(cardX, cardY, cardX + cardWidth, cardY, radius);
            ctx.closePath();
            ctx.fillStyle = cardBg;
            ctx.fill();
            ctx.restore();

            // 3. Icono del Corazón
            const centerX = width / 2;
            const heartY = cardY + 130;
            
            ctx.save();
            ctx.fillStyle = accentColor;
            ctx.beginPath();
            ctx.moveTo(centerX, heartY + 20);
            ctx.bezierCurveTo(centerX, heartY + 17, centerX - 25, heartY, centerX - 25, heartY - 20);
            ctx.bezierCurveTo(centerX - 25, heartY - 40, centerX, heartY - 40, centerX, heartY - 15);
            ctx.bezierCurveTo(centerX, heartY - 40, centerX + 25, heartY - 40, centerX + 25, heartY - 20);
            ctx.bezierCurveTo(centerX + 25, heartY, centerX, heartY + 17, centerX, heartY + 20);
            ctx.fill();
            ctx.restore();

            // 4. Marca "SoloParaUsted"
            ctx.fillStyle = textColor;
            ctx.font = '600 42px "Cormorant Garamond", serif';
            ctx.textAlign = 'center';
            ctx.fillText('SoloParaUsted', centerX, heartY + 80);

            // 5. Categoría Badge
            ctx.fillStyle = subTextColor;
            ctx.font = '500 22px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(`— ${category.toUpperCase()} —`, centerX, heartY + 125);

            // 6. Texto de la frase (Ajuste automático de texto)
            ctx.fillStyle = textColor;
            ctx.font = 'italic 500 48px "Cormorant Garamond", serif';
            
            const maxTextWidth = cardWidth - 140;
            const words = quoteText.split(' ');
            let line = '';
            const lines = [];

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxTextWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());

            const lineHeight = 65;
            const totalTextHeight = lines.length * lineHeight;
            let startY = (height / 2) - (totalTextHeight / 2) + 60;

            for (let k = 0; k < lines.length; k++) {
                ctx.fillText(`“${lines[k]}”`, centerX, startY + (k * lineHeight));
            }

            // 7. Pie de la tarjeta
            ctx.fillStyle = subTextColor;
            ctx.font = '400 20px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('soloparausted.com', centerX, cardY + cardHeight - 70);

            // Exportar a imagen y descargar
            const imageURI = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `SoloParaUsted-${category}-${todayISO}.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('✓ Imagen descargada lista para compartir');
        }

        /* ==========================================================================
           ADMINISTRACIÓN Y NAVEGACIÓN
           ========================================================================== */
        function showAdmin(e) {
            e.preventDefault();
            const pass = prompt("Ingresa la clave de administrador:");
            if (pass === "1234") {
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                renderHistory();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        function showHome(e) {
            if (e) e.preventDefault();
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
            renderQuote();
        }

        function saveNewQuote() {
            const text = document.getElementById('new-quote-text').value.trim();
            const date = document.getElementById('new-quote-date').value;
            const category = document.getElementById('new-quote-category').value;

            if (!text || !date) {
                alert("Por favor completa el texto de la frase y la fecha.");
                return;
            }

            const newEntry = {
                id: loadedQuotes.length > 0 ? Math.max(...loadedQuotes.map(q => q.id)) + 1 : 1,
                fecha: date,
                texto: text,
                categoria: category
            };

            loadedQuotes.push(newEntry);
            loadedQuotes.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));

            document.getElementById('admin-feedback').textContent = "¡Frase guardada con éxito!";
            document.getElementById('new-quote-text').value = '';

            renderHistory();

            setTimeout(() => {
                document.getElementById('admin-feedback').textContent = '';
            }, 3000);
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            const totalCount = document.getElementById('total-count');
            historyList.innerHTML = '';
            totalCount.textContent = loadedQuotes.length;

            if (loadedQuotes.length === 0) {
                historyList.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-secondary); text-align: center; padding: 1rem;">No hay frases en el historial.</p>';
                return;
            }

            const sortedForHistory = [...loadedQuotes].reverse();

            sortedForHistory.forEach((q) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-info">
                        <div class="history-date">📅 ${q.fecha} — [${q.categoria}]</div>
                        <div class="history-text">"${q.texto}"</div>
                    </div>
                    <button class="btn-delete" onclick="deleteQuote(${q.id})">Eliminar</button>
                `;
                historyList.appendChild(item);
            });
        }

        function deleteQuote(id) {
            if (confirm("¿Estás seguro de que deseas eliminar esta frase?")) {
                loadedQuotes = loadedQuotes.filter(q => q.id !== id);
                localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));
                renderHistory();
                showToast("Frase eliminada del historial");
            }
        }

        /* ==========================================================================
           UTILIDADES (COPIAR Y COMPARTIR)
           ========================================================================== */
        function copyQuote() {
            const text = document.getElementById('quote-text').textContent.trim();
            const fullText = `${text} — SoloParaUsted`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(fullText).then(() => {
                    showToast('✓ Frase copiada al portapapeles');
                });
            } else {
                const textArea = document.createElement('textarea');
                textArea.value = fullText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast('✓ Frase copiada al portapapeles');
            }
        }

        function shareQuote() {
            const text = document.getElementById('quote-text').textContent.trim();
            const shareData = {
                title: 'SoloParaUsted',
                text: `${text} — Descubierto en SoloParaUsted:`,
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(`${text}\n\nDescubre más en: ${window.location.href}`)}`;
                window.open(whatsappUrl, '_blank');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
