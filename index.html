<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloParaUsted - Frases Románticas Diarias</title>
    <!-- Google Fonts: Cormorant Garamond (Serif elegante) y Plus Jakarta Sans (Sans-serif limpia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-rosa-suave: #FFF5F7;
            --bg-tarjeta: #FFFFFF;
            --rosa-empolvado: #FAD2E1;
            --rosa-acento: #D8A4B8;
            --vino-suave: #6B3E48;
            --texto-principal: #4A2E35;
            --texto-secundario: #8C6A72;
            --borde-suave: rgba(216, 164, 184, 0.25);
            --sombra-elegante: 0 10px 30px rgba(107, 62, 72, 0.05);
            --rojo-suave: #D96868;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-rosa-suave);
            color: var(--texto-principal);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            -webkit-font-smoothing: antialiased;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
        }

        nav a {
            color: var(--texto-secundario);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 1.5rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--vino-suave);
        }

        .main-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            justify-content: center;
        }

        /* Logo Vectorial en Tonos Rosa */
        .logo-container {
            margin-bottom: 2.5rem;
        }

        .logo-svg {
            width: 70px;
            height: 70px;
            fill: var(--rosa-acento);
            margin-bottom: 0.5rem;
            animation: pulseHeart 3s infinite ease-in-out;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .logo-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--vino-suave), var(--rosa-acento));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--texto-secundario);
            margin-top: 0.4rem;
        }

        /* Tarjeta de Frase Minimalista */
        .quote-card {
            background-color: var(--bg-tarjeta);
            width: 100%;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: var(--sombra-elegante);
            border: 1px solid var(--borde-suave);
            position: relative;
            margin-bottom: 2rem;
        }

        .quote-date {
            font-size: 0.85rem;
            color: var(--texto-secundario);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .quote-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            line-height: 1.4;
            color: var(--vino-suave);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .quote-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-rosa-suave);
            color: var(--vino-suave);
            border: 1px solid var(--rosa-empolvado);
            padding: 0.65rem 1.25rem;
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--rosa-empolvado);
            transform: translateY(-2px);
        }

        /* Panel de Administración */
        .admin-panel {
            display: none;
            width: 100%;
            max-width: 650px;
            background: var(--bg-tarjeta);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: var(--sombra-elegante);
            border: 1px solid var(--borde-suave);
            text-align: left;
            margin-top: 1rem;
        }

        .admin-panel h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--vino-suave);
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--texto-secundario);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-group textarea, .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--rosa-empolvado);
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-rosa-suave);
            color: var(--texto-principal);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea:focus, .form-group input:focus {
            border-color: var(--vino-suave);
        }

        /* Historial en Admin */
        .history-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--borde-suave);
            padding-top: 1.5rem;
        }

        .history-section h3 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--vino-suave);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.5rem;
        }

        .history-item {
            background: var(--bg-rosa-suave);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--borde-suave);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .history-info {
            flex: 1;
        }

        .history-date {
            font-size: 0.75rem;
            color: var(--texto-secundario);
            font-weight: 600;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .history-text {
            font-size: 0.9rem;
            color: var(--vino-suave);
            font-style: italic;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--rojo-suave);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: rgba(217, 104, 104, 0.1);
        }

        /* Toast de notificación */
        .toast {
            position: fixed;
            bottom: 2rem;
            background-color: var(--vino-suave);
            color: #FFFFFF;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--texto-secundario);
            padding-top: 2rem;
        }

        @media (max-width: 600px) {
            .logo-title { font-size: 2.2rem; }
            .quote-text { font-size: 1.5rem; }
            .quote-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 600; color: var(--vino-suave); letter-spacing: 0.5px;">SoloParaUsted</div>
        <nav>
            <a href="#" onclick="showHome(event)">Inicio</a>
            <a href="#admin" onclick="showAdmin(event)">Administrador</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- VISTA PRINCIPAL: FRASE DEL DÍA -->
        <div id="home-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <h1 class="logo-title">SoloParaUsted</h1>
                <p class="logo-subtitle">Frases románticas diarias</p>
            </div>

            <div class="quote-card">
                <div class="quote-date" id="current-date">Cargando fecha...</div>
                <div class="quote-text" id="quote-text">"Cargando frase con amor..."</div>
                <div class="quote-actions">
                    <button class="btn" onclick="copyQuote()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        Copiar Frase
                    </button>
                    <button class="btn" onclick="shareQuote()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                        Compartir
                    </button>
                </div>
            </div>
        </div>

        <!-- VISTA DE ADMINISTRADOR -->
        <div id="admin-view" class="admin-panel">
            <h2>Panel de Creación</h2>
            <div class="form-group">
                <label for="new-quote-text">Nueva Frase Romántica</label>
                <textarea id="new-quote-text" rows="3" placeholder="Escribe aquí la nueva frase..."></textarea>
            </div>
            <div class="form-group">
                <label for="new-quote-date">Fecha de Publicación</label>
                <input type="date" id="new-quote-date">
            </div>
            <div class="form-group">
                <label for="new-quote-category">Categoría</label>
                <input type="text" id="new-quote-category" value="Amor">
            </div>
            <button class="btn" onclick="saveNewQuote()" style="background-color: var(--vino-suave); color: #FFF; width: 100%; justify-content: center;">Guardar Nueva Frase</button>
            <p id="admin-feedback" style="font-size: 0.8rem; color: var(--texto-secundario); margin-top: 1rem; text-align: center;"></p>

            <!-- SECCIÓN DE HISTORIAL -->
            <div class="history-section">
                <h3>Historial de Frases (<span id="total-count">0</span>)</h3>
                <div class="history-list" id="history-list">
                    <!-- Las frases se cargan aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        Hecho con amor para ti • SoloParaUsted © 2026
    </footer>

    <div class="toast" id="toast">¡Frase copiada al portapapeles!</div>

    <script>
        // Formatear fecha actual en español
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const todayFormatted = new Date().toLocaleDateString('es-ES', options);
        document.getElementById('current-date').textContent = todayFormatted;

        // Fecha en formato YYYY-MM-DD
        const todayISO = new Date().toISOString().split('T')[0];
        document.getElementById('new-quote-date').value = todayISO;

        let loadedQuotes = [];

        // Cargar las frases desde el archivo JSON local o localStorage
        async function loadQuotes() {
            try {
                const localStored = localStorage.getItem('soloparausted_frases');
                if (localStored) {
                    loadedQuotes = JSON.parse(localStored);
                } else {
                    const response = await fetch('frases.json');
                    const data = await response.json();
                    loadedQuotes = data.frases;
                    localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));
                }
                displayTodayQuote();
                renderHistory();
            } catch (error) {
                console.error("Error cargando frases:", error);
                document.getElementById('quote-text').textContent = "“Eres el pensamiento más bonito que habita en mi corazón.”";
            }
        }

        function displayTodayQuote() {
            let currentQuote = loadedQuotes.find(q => q.fecha === todayISO);
            if (!currentQuote && loadedQuotes.length > 0) {
                currentQuote = loadedQuotes[loadedQuotes.length - 1];
            }
            if (currentQuote) {
                document.getElementById('quote-text').textContent = `"${currentQuote.texto}"`;
            }
        }

        // Navegación entre vistas
        function showAdmin(e) {
            e.preventDefault();
            const pass = prompt("Ingresa la clave de administrador:");
            if (pass === "1234") { // Puedes cambiar tu clave aquí
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                renderHistory();
            } else if (pass !== null) {
                alert("Clave incorrecta.");
            }
        }

        function showHome(e) {
            e.preventDefault();
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
            displayTodayQuote();
        }

        // Guardar nueva frase
        function saveNewQuote() {
            const text = document.getElementById('new-quote-text').value.trim();
            const date = document.getElementById('new-quote-date').value;
            const category = document.getElementById('new-quote-category').value.trim();

            if (!text || !date) {
                alert("Por favor completa la frase y la fecha.");
                return;
            }

            const newEntry = {
                id: loadedQuotes.length > 0 ? Math.max(...loadedQuotes.map(q => q.id)) + 1 : 1,
                fecha: date,
                texto: text,
                autor: "SoloParaUsted",
                categoria: category || "Amor"
            };

            loadedQuotes.push(newEntry);
            // Ordenar por fecha cronológicamente
            loadedQuotes.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));

            document.getElementById('admin-feedback').textContent = "¡Frase guardada con éxito en el sistema!";
            document.getElementById('new-quote-text').value = '';
            
            renderHistory();

            setTimeout(() => {
                document.getElementById('admin-feedback').textContent = '';
            }, 3000);
        }

        // Renderizar el historial en el panel de administración
        function renderHistory() {
            const historyList = document.getElementById('history-list');
            const totalCount = document.getElementById('total-count');
            historyList.innerHTML = '';
            totalCount.textContent = loadedQuotes.length;

            if (loadedQuotes.length === 0) {
                historyList.innerHTML = '<p style="font-size: 0.85rem; color: var(--texto-secundario); text-align: center; padding: 1rem;">No hay frases guardadas aún.</p>';
                return;
            }

            // Mostrar desde la más reciente a la más antigua en el panel
            const sortedForHistory = [...loadedQuotes].reverse();

            sortedForHistory.forEach((q) => {
                const item = document.div = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-info">
                        <div class="history-date">📅 ${q.fecha} — [${q.categoria}]</div>
                        <div class="history-text">"${q.texto}"</div>
                    </div>
                    <button class="btn-delete" onclick="deleteQuote(${q.id})">Eliminar</button>
                `;
                historyList.appendChild(item);
            });
        }

        // Eliminar una frase del historial
        function deleteQuote(id) {
            if (confirm("¿Estás seguro de que deseas eliminar esta frase?")) {
                loadedQuotes = loadedQuotes.filter(q => q.id !== id);
                localStorage.setItem('soloparausted_frases', JSON.stringify(loadedQuotes));
                renderHistory();
                showToast("Frase eliminada con éxito");
            }
        }

        // Acciones de copiado y compartir
        function copyQuote() {
            const text = document.getElementById('quote-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast("¡Frase copiada al portapapeles!");
            });
        }

        function shareQuote() {
            const text = document.getElementById('quote-text').textContent + " ✨ — SoloParaUsted";
            if (navigator.share) {
                navigator.share({
                    title: 'SoloParaUsted',
                    text: text,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, '_blank');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        window.onload = loadQuotes;
    </script>
</body>
</html>
